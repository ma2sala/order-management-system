<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cashier Dashboard</title>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="cashier.css" />
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>CASHIER</h1>
      <p class="subtitle">Cashier / Manager sign in</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />

        <button type="submit" class="login-submit">Sign In</button>
        <p class="login-error" id="loginError"></p>
      </form>

      <div class="login-hint">
        No cashier account yet? Create one from the Manager Dashboard's Staff tab (role: Cashier).
      </div>
    </div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="appScreen" class="hidden">

    <header class="app-header">
      <div class="header-left">
        <span class="icon">💵</span>
        <div>
          <h1 class="display-heading app-title">CASHIER</h1>
          <p class="app-subtitle" id="dateDisplay"></p>
        </div>
      </div>
      <div class="header-right">
        <input type="date" id="headerDateInput" class="date-input" title="Filter by date" />
        <button id="refreshBtn" class="icon-btn" title="Refresh">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.14-6.36L21 8"></path><path d="M21 3v5h-5"></path></svg>
        </button>
        <button id="logoutBtn" class="icon-btn" aria-label="Log out" title="Log out">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <div class="view-toggle">
      <button class="toggle-btn active" data-view="bills">Open Bills</button>
      <button class="toggle-btn" data-view="history">Payment History</button>
    </div>

    <!-- ---------------- OPEN BILLS ---------------- -->
    <section id="billsView" class="view-section">
      <div id="tablesGrid" class="tables-grid"></div>
    </section>

    <!-- ---------------- PAYMENT HISTORY ---------------- -->
    <section id="historyView" class="view-section hidden">
      <label class="date-picker-label">
        Day
        <input type="date" id="historyDateInput" class="date-input" />
      </label>
      <div id="historyList" class="history-list"></div>
    </section>

  </div>

  <!-- ---------------- Bill detail modal ---------------- -->
  <div id="billModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header-row">
        <h2 class="modal-title" id="billModalTitle">Table Bill</h2>
        <button type="button" id="billCloseBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="billBody"></div>

      <div class="pay-controls">
        <label>Payment method</label>
        <div id="paymentMethodGrid" class="payment-method-grid">
          <button type="button" class="payment-tile active" data-method="CASH">
            <span class="payment-tile-icon">💵</span>
            <span class="payment-tile-label">Cash</span>
          </button>
          <button type="button" class="payment-tile" data-method="CARD">
            <span class="payment-tile-icon">💳</span>
            <span class="payment-tile-label">Card</span>
          </button>
          <button type="button" class="payment-tile" data-method="TELEBIRR">
            <img src="images/telebirr.png" alt="" class="payment-tile-logo" />
            <span class="payment-tile-label">Telebirr</span>
          </button>
          <button type="button" class="payment-tile" data-method="CBE">
            <img src="images/cbe.jpg" alt="" class="payment-tile-logo" />
            <span class="payment-tile-label">CBE</span>
          </button>
          <button type="button" class="payment-tile" data-method="BOA">
            <img src="images/boa.png" alt="" class="payment-tile-logo" />
            <span class="payment-tile-label">BOA</span>
          </button>
          <button type="button" class="payment-tile" data-method="MOBILE_MONEY">
            <span class="payment-tile-icon">📱</span>
            <span class="payment-tile-label">Other Mobile Money</span>
          </button>
        </div>

        <label for="paymentScreenshotInput">Payment screenshot (optional)</label>
        <input type="file" id="paymentScreenshotInput" accept="image/*" />
        <p class="field-hint">For Telebirr/CBE/BOA — attach the customer's transaction confirmation as proof.</p>
        <div id="screenshotPreviewWrap" class="screenshot-preview-wrap hidden">
          <img id="screenshotPreview" class="screenshot-preview" alt="Payment screenshot preview" />
          <button type="button" id="removeScreenshotBtn" class="small-btn void">Remove</button>
        </div>

        <p class="modal-error" id="payError"></p>

        <button type="button" id="markPaidBtn" class="primary-btn pay-btn">Mark Paid & Print Receipt</button>
      </div>
    </div>
  </div>

  <!-- ---------------- Screenshot lightbox (view a past payment's proof) ---------------- -->
  <div id="screenshotLightbox" class="modal-overlay hidden">
    <div class="lightbox-card">
      <button type="button" id="lightboxCloseBtn" class="icon-btn lightbox-close" aria-label="Close">✕</button>
      <img id="lightboxImage" alt="Payment screenshot" />
    </div>
  </div>

  <!-- ---------------- Printable receipt (hidden on screen, shown only when printing) ---------------- -->
  <div id="receiptPrintArea" class="receipt-print-area"></div>

<script src="cashier.js"></script>
</body>
</html>
